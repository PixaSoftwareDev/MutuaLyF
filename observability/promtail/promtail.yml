server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Sin filtro de proyecto desde 2026-08-20: se centralizan los logs de
        # TODOS los stacks (intellix prod/dev + apps satelite migradas).
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
        regex: "/(.*)"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
    pipeline_stages:
      - docker: {}
      # Parsear JSON de structlog (backend y workers). SIN drop_malformed
      # (2026-09-03): el 99,7% del log del backend es texto plano (uvicorn,
      # librerías, tracebacks) y se descartaba entero — Loki tenía 24 líneas/día.
      # Las líneas no-JSON entran sin etiquetas de nivel/tenant; las JSON, con ellas.
      - json:
          expressions:
            level: level
            event: event
            tenant_id: tenant_id
            request_id: request_id
      - labels:
          level:
          tenant_id:
          service:
