# Telegraf — métricas POR CONTENEDOR vía API de Docker (cpu/mem/red).
# Existe porque cAdvisor no soporta el containerd-snapshotter de este host
# y descarta todos los contenedores (bug descubierto 2026-08-20).
[agent]
  interval = "30s"
  flush_interval = "30s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "10s"
  perdevice = false
  total = true

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "120s"
  collectors_exclude = ["gocollector", "process"]
